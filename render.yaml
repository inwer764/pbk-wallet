services:
  - type: web
    name: pbk-wallet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pbk-db
          property: connectionString

databases:
  - name: pbk-db
    plan: free
    databaseName: pbk